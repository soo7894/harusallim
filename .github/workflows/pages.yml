name: Deploy GitHub Pages

on:
  push:
    branches: [main, app-version]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          ref: main
          path: homepage
      - name: Checkout PWA app
        uses: actions/checkout@v4
        with:
          ref: app-version
          path: app-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            homepage/pnpm-lock.yaml
            app-version/pnpm-lock.yaml
      - name: Build and test homepage
        working-directory: homepage
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Build and test PWA app
        working-directory: app-version
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Combine homepage and app
        run: |
          mkdir -p homepage/dist/app
          cp -R app-version/dist/. homepage/dist/app/
          touch homepage/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homepage/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
